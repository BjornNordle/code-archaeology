name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > .env <<EOF
          DOMAIN=${{ secrets.DOMAIN }}
          GITHUB_TOKEN=${{ secrets.GH_PRIVATE_REPO_TOKEN }}
          EOF

      - name: Build and restart
        run: |
          docker compose up -d --build
          docker compose restart caddy

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            curl -sf http://localhost:8081/api/health > /dev/null && echo "OK" && exit 0
            echo "Waiting... ($i/12)"
            sleep 10
          done
          echo "Health check failed after 2 minutes" && exit 1

      - name: pip-audit (report only)
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          set +e  # report-only: findings never fail the deploy
          # Audit exactly what's installed in the built image. Freeze first so
          # pip-audit's own deps (installed only for this throwaway container) aren't audited.
          docker compose run --rm --no-deps -T --user root --entrypoint sh app -c '
            pip freeze > /tmp/installed.txt &&
            pip install --quiet --no-cache-dir --root-user-action=ignore pip-audit >/dev/null 2>&1 &&
            pip-audit -r /tmp/installed.txt --no-deps --disable-pip --progress-spinner off
          ' > "$RUNNER_TEMP/pip-audit.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/pip-audit.txt"
          [ $rc -eq 0 ] && exit 0

          summary=$(grep -E '^Found [0-9]+ known vulnerabilit' "$RUNNER_TEMP/pip-audit.txt")
          if [ -z "$summary" ]; then
            echo "::warning title=pip-audit::scan did not complete (exit $rc)"
            exit 0
          fi
          echo "::warning title=pip-audit::$summary"
          [ -z "$NTFY_URL" ] && exit 0
          grep -v -i '^warning' "$RUNNER_TEMP/pip-audit.txt" | head -c 3500 | \
            curl -sf -X POST "$NTFY_URL" \
              -H "Title: [CVE] code-archaeology — $summary" \
              -H "Tags: warning" \
              -H "Priority: high" \
              --data-binary @- || true

      - name: Notify deploy success
        if: success()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          [ -z "$NTFY_URL" ] && exit 0
          curl -sf -X POST "$NTFY_URL" \
            -H "Title: [DEPLOYED] code-archaeology" \
            -H "Tags: white_check_mark" \
            -H "Priority: default" \
            -d "Deploy succeeded — commit ${{ github.sha }} by ${{ github.actor }}" || true

      - name: Notify deploy failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          [ -z "$NTFY_URL" ] && exit 0
          curl -sf -X POST "$NTFY_URL" \
            -H "Title: [DEPLOY FAILED] code-archaeology" \
            -H "Tags: rotating_light" \
            -H "Priority: urgent" \
            -d "Deploy FAILED — commit ${{ github.sha }} by ${{ github.actor }}" || true
